name: Publish Docker image to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and verify image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="manual-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull -f docker/Dockerfile -t "$image:$tag" .
          docker run --rm "$image:$tag" node --check src/index.js
          docker run --rm "$image:$tag" node -e "import('./src/catalog.js').then(({ operationCount }) => { if (!operationCount) process.exit(1); })"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="manual-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          docker push "$image:$tag"
          if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            docker tag "$image:$tag" "$image:latest"
            docker push "$image:latest"
          fi
